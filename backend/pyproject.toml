[project]
name = "rubriciq-backend"
version = "0.1.0"
description = "RubricIQ FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "bcrypt>=4.2",
    "pyjwt>=2.10",
    "slowapi>=0.1.9",
    "httpx>=0.27",
    "email-validator>=2",
    "python-multipart>=0.0.27",
    "apscheduler>=3.10,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-postgresql>=6.1",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Body",
    "fastapi.Form",
    "fastapi.File",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
